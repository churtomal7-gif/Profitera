<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProfitEra - Register</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }

        body {
            background: #020905;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: rgba(4, 28, 16, 0.85);
            border: 1px solid rgba(0, 255, 135, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.1);
        }

        .auth-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 12.5px;
            color: #799988;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #799988;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 135, 0.2);
            border-radius: 12px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #00ff87;
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #00ff87 0%, #00b359 100%);
            color: #01140a;
            border: none;
            padding: 13px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.2);
            margin-top: 10px;
        }

        .auth-btn:active {
            opacity: 0.85;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #799988;
        }

        .auth-footer a {
            color: #00ff87;
            text-decoration: none;
            font-weight: 700;
        }

        /* Custom Alert Popup Styles */
        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 9, 5, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .custom-alert-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .custom-alert-card {
            width: 100%; max-width: 320px;
            background: #041c10;
            border: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 20px; padding: 22px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.2);
        }

        .custom-alert-icon {
            width: 50px; height: 50px;
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid rgba(0, 255, 135, 0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; color: #00ff87; font-size: 20px;
        }

        .custom-alert-title {
            font-size: 16px; font-weight: 800; color: #ffffff; margin-bottom: 8px;
        }

        .custom-alert-message {
            font-size: 12.5px; color: #c2d6cc; line-height: 1.5; margin-bottom: 20px;
        }

        .custom-alert-btn {
            width: 100%; padding: 11px;
            background: linear-gradient(135deg, #00ff87 0%, #00b359 100%);
            border: none; border-radius: 12px;
            color: #01140a; font-size: 12px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.2);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-title">Create Account</div>
        <div class="auth-subtitle">Join ProfitEra & Start Earning</div>

        <form id="registerForm">
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneInput" placeholder="Enter your phone number" class="form-control" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="Enter secure password" class="form-control" required>
            </div>

            <div class="input-group">
                <label>Referral Code (Optional)</label>
                <input type="text" id="referInputId" placeholder="No referral code" class="form-control">
            </div>

            <button type="submit" class="auth-btn">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <!-- Custom Alert Popup -->
    <div class="custom-alert-overlay" id="customAlertBox">
        <div class="custom-alert-card">
            <div class="custom-alert-icon" id="customAlertIcon"><i class="fa-solid fa-check"></i></div>
            <div class="custom-alert-title" id="customAlertTitle">Success</div>
            <div class="custom-alert-message" id="customAlertMsg">Message goes here...</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Script Logic with Referral Code Auto-Catch -->
    <script>
        window.showAlert = function(title, message, type = "success") {
            const alertBox = document.getElementById("customAlertBox");
            const titleElem = document.getElementById("customAlertTitle");
            const msgElem = document.getElementById("customAlertMsg");
            const iconElem = document.getElementById("customAlertIcon");

            if (titleElem) titleElem.innerText = title;
            if (msgElem) msgElem.innerText = message;
            
            if (iconElem) {
                if (type === "error") {
                    iconElem.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                    iconElem.style.color = "#ff4d4d";
                    iconElem.style.borderColor = "rgba(255, 77, 77, 0.4)";
                    iconElem.style.background = "rgba(255, 77, 77, 0.1)";
                } else {
                    iconElem.innerHTML = '<i class="fa-solid fa-check"></i>';
                    iconElem.style.color = "#00ff87";
                    iconElem.style.borderColor = "rgba(0, 255, 135, 0.3)";
                    iconElem.style.background = "rgba(0, 255, 135, 0.1)";
                }
            }
            if (alertBox) alertBox.classList.add("active");
        };

        window.closeCustomAlert = function() {
            const alertBox = document.getElementById("customAlertBox");
            if (alertBox) alertBox.classList.remove("active");
        };

        // Auto catch ?ref= code from URL and lock it
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');

            if (refCode) {
                const referInput = document.getElementById("referInputId");
                if (referInput) {
                    referInput.value = refCode;
                    referInput.setAttribute("readonly", true); // Lock input so user can't change it
                    referInput.style.background = "rgba(0, 255, 135, 0.05)";
                    referInput.style.color = "#00ff87";
                    referInput.style.cursor = "not-allowed";
                }
            }
        });

        // Form Submission placeholder logic
        document.getElementById("registerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const phone = document.getElementById("phoneInput").value;
            const refCode = document.getElementById("referInputId").value;
            
            // Here you can put your Firebase Register Authentication & Firestore save logic
            showAlert("সফল!", "রেজিস্ট্রেশন সফল হয়েছে!", "success");
        });
    </script>
</body>
</html>
