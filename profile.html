    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }

        body {
            background: #020905;
            color: #ffffff;
            padding-bottom: 90px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Top Header */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            background: rgba(4, 28, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 135, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Account Container */
        .account-container {
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Profile Section */
        .profile-card {
            background: rgba(4, 28, 16, 0.65);
            border: 1px solid rgba(0, 255, 135, 0.18);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-name {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
        }

        .profile-contact {
            font-size: 12px;
            color: #799988;
            font-weight: 600;
        }

        .profile-balance {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #00ff87;
            margin-top: 4px;
        }

        .profile-svg-box {
            width: 58px;
            height: 58px;
            background: rgba(0, 255, 135, 0.1);
            border: 2px solid rgba(0, 255, 135, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.2);
        }

        .profile-svg-box svg {
            width: 30px;
            height: 30px;
            fill: #00ff87;
        }

        /* Section Title "Wallet" */
        .wallet-section-title {
            font-size: 12px;
            font-weight: 700;
            color: #799988;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        /* Menu Options Card Box */
        .menu-card-box {
            background: rgba(4, 28, 16, 0.65);
            border: 1px solid rgba(0, 255, 135, 0.18);
            border-radius: 16px;
            padding: 6px 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0, 255, 135, 0.08);
            text-decoration: none;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            width: 36px;
            height: 36px;
            background: rgba(0, 255, 135, 0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 255, 135, 0.15);
        }

        .menu-icon svg {
            width: 18px;
            height: 18px;
            fill: #00ff87;
        }

            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .menu-arrow {
            color: #799988;
            font-size: 14px;

            color: #ff4757;

    <!-- Firebase SDKs & Profile Logic with Persistence -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtiy7GaMSGC_HUzVUD_lfHFGOp7UQ-Uxw",
            authDomain: "profitera.firebaseapp.com",
            projectId: "profitera",
            storageBucket: "profitera.firebasestorage.app",
            messagingSenderId: "510851771912",
            appId: "1:510851771912:web:2b1ea236545239ba072bbd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).then(async () => {
            const savedPhone = localStorage.getItem("activeUserPhone") || localStorage.getItem("userPhone") || localStorage.getItem("phone");
            const savedUid = localStorage.getItem("activeUserUid") || localStorage.getItem("userId");
            
            let identifier = savedUid || savedPhone;
            if (identifier) {
                await loadUserProfile(identifier);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const userIdent = user.phoneNumber || user.uid || user.email;
                    localStorage.setItem("activeUserUid", user.uid);
                    await loadUserProfile(userIdent);
                } else {
                    if (identifier) {
                        await loadUserProfile(identifier);
                    } else {
                        window.location.href = "login.html";
                    }
                }
            });
        }).catch((error) => {
            console.error("Persistence error:", error);
        });

        async function loadUserProfile(phoneOrId) {
            if (!phoneOrId) return;
            let cleanPhone = phoneOrId.toString().trim();
            if(!cleanPhone.startsWith("+") && cleanPhone.length === 11) {
                cleanPhone = "+88" + cleanPhone;
            }

            try {
                let userDocData = null;

                // ১. Direct doc check by cleanPhone
                let docRef = doc(db, "Users", cleanPhone);
                let docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    userDocData = docSnap.data();
                } else {
                    // ২. Query by phoneNumber field
                    let q = query(collection(db, "Users"), where("phoneNumber", "==", cleanPhone));
                    let querySnap = await getDocs(q);
                    if (!querySnap.empty) {
                        userDocData = querySnap.docs[0].data();
                    } else {
                        // ৩. Direct doc check by phoneOrId / userId
                        let docRef2 = doc(db, "Users", phoneOrId);
                        let docSnap2 = await getDoc(docRef2);
                        if (docSnap2.exists()) {
                            userDocData = docSnap2.data();
                        } else {
                            // ৪. Query by userId field
                            let q2 = query(collection(db, "Users"), where("userId", "==", phoneOrId));
                            let querySnap2 = await getDocs(q2);
                            if (!querySnap2.empty) {
                                userDocData = querySnap2.docs[0].data();
                            }
                        }
                    }
                }

                if (userDocData) {
                    const userName = userDocData.fullName || userDocData.name || "User Account";
                    document.getElementById("userNameDisplay").innerText = userName;

                    document.getElementById("userContactDisplay").innerText = userDocData.phoneNumber || phoneOrId;
                    
                    const userBalance = userDocData.balance !== undefined ? userDocData.balance : (userDocData.userBalance || 0);
                    document.getElementById("userBalanceDisplay").innerText = "Balance: ৳ " + Number(userBalance).toLocaleString();
                } else {
                    document.getElementById("userNameDisplay").innerText = "User Account";
                    document.getElementById("userContactDisplay").innerText = phoneOrId;
                    document.getElementById("userBalanceDisplay").innerText = "Balance: ৳ 0";
                }
            } catch (error) {
                console.error("Error loading profile data:", error);
            }
        }

        document.getElementById("langLogout").addEventListener("click", async () => {
            try {
                localStorage.removeItem("activeUserPhone");
                localStorage.removeItem("activeUserUid");
                localStorage.removeItem("userPhone");
                localStorage.removeItem("userId");
                await signOut(auth);
                window.location.href = "login.html";
            } catch (error) {
                console.error("Logout error:", error);
            }
        });
    </script>

        }
